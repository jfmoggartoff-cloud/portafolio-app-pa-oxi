<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PROINVERSIÓN · Presentación</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/deck.css">
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div class="topbar">
  <button class="tbtn tbtn-txt" id="pdf" title="Descargar la presentación en PDF" aria-label="Descargar PDF"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>PDF</span></button>
  <button class="tbtn" id="ov" title="Vista general (O)" aria-label="Vista general"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
  <button class="tbtn" id="fs" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <div id="lang" role="group" aria-label="Idioma / Language"><button data-l="es">ES</button><button data-l="en">EN</button></div>
</div>
<div id="prog" aria-hidden="true"></div>
<div id="hint"><span><kbd>→</kbd>avanzar</span><span><kbd>←</kbd>retroceder</span><span><kbd>L</kbd>idioma</span><span><kbd>F</kbd>pantalla completa</span><span><kbd>O</kbd>vista general</span><span><kbd>B</kbd>pantalla negra</span></div>
<div id="overview"></div>
<div id="black"></div>
<div id="tip" role="tooltip"></div>
<div id="pdfAviso" role="status"></div>
<script src="contenido.js"></script>
<script src="datos.js"></script>
<script src="assets/deck-core.js"></script>
<script src="assets/deck-datos.js"></script>
<script src="assets/audiencia.js"></script>
</body>
</html>
